name: Release

# Publishing happens here rather than from a laptop, so a release is always
# built by the same Node from a clean checkout. This workflow owns the bump,
# the tag and the publish, so there is one button rather than a sequence to
# remember.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'npm version to publish'
        type: choice
        required: true
        default: 'current (publish package.json as it stands)'
        options:
          # The leading word of each label is the bump keyword, taken apart in
          # "Resolve the bump" below. Keep the keyword first when editing one.
          - 'current (publish package.json as it stands, no bump, no tag)'
          - 'patch (x.y.z+1, bug fixes)'
          - 'minor (x.y+1.0, new functionality)'
          - 'major (x+1.0.0, api breaking changes)'
          - 'prepatch (x.y.z+1-rc.0, patch release candidate)'
          - 'preminor (x.y+1.0-rc.0, minor release candidate)'
          - 'premajor (x+1.0.0-rc.0, major release candidate)'
          - 'prerelease (x.y.z-rc.N+1, next release candidate)'
          - 'release (x.y.z, promote the current release candidate to final)'
      dry_run:
        description: 'Dry run (everything except git push & npm publish)'
        type: boolean
        default: true
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    # Named in npm's trusted publisher configuration, so the OIDC claim only
    # matches when the job runs here. Its required reviewer also gates the whole
    # job before any step runs, on dry runs too.
    environment: npm-publish
    permissions:
      contents: write # pushes the version commit and tag
      # Lets npm attach provenance, tying the tarball to this commit and
      # workflow. Public repositories only, which this is.
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      # actions/checkout sets up push credentials but no committer identity, and
      # the runner has no name for git to fall back on, so the commit `npm
      # version` makes would fail with "empty ident name".
      - name: Configure git identity
        run: |
          git config user.name '${{ github.actor }}'
          git config user.email '${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com'

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org/

      # Puppeteer is only for the screenshots, and its Chrome download is the
      # slowest part of an install that doesn't need it.
      - run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"

      - name: Resolve the bump
        env:
          VERSION_LABEL: ${{ inputs.version }}
        run: echo "SEMVER_UPDATE=${VERSION_LABEL%% *}" >> "$GITHUB_ENV"

      - name: Version package
        if: env.SEMVER_UPDATE != 'current'
        run: |
          case "$SEMVER_UPDATE" in
            # From 1.2.3-rc.4, a patch bump drops the prerelease: 1.2.3.
            release) npm version patch ;;
            pre*)    npm version "$SEMVER_UPDATE" --preid rc ;;
            *)       npm version "$SEMVER_UPDATE" ;;
          esac
          # npm's version commit subject is the bare version number. Anything
          # else means the bump didn't happen, and we would go on to tag and
          # publish the wrong commit.
          SUBJECT="$(git show -s --format=%s)"
          case "$SUBJECT" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::expected a version commit, got '$SUBJECT'"; exit 1 ;;
          esac

      # Prereleases go out under the `rc` dist-tag so that a plain
      # `npm install consolepro` keeps resolving to the latest stable release.
      - name: Work out the dist-tag
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          case "$VERSION" in
            *-*) echo "NPM_DIST_TAG=rc" >> "$GITHUB_ENV" ;;
            *)   echo "NPM_DIST_TAG=latest" >> "$GITHUB_ENV" ;;
          esac

      # The release commit says what is in the release. npm's own message is the
      # bare version number, so the notes are amended onto it, and the tag it
      # made is moved to the rewritten commit.
      - name: Amend with the changelog
        if: env.SEMVER_UPDATE != 'current'
        run: |
          # Promoting a release candidate reports against the last stable
          # release, so the notes cover the whole rc series rather than only
          # what changed since the previous rc.
          FROM_TAG="$(git describe --tags --abbrev=0 HEAD~1 2>/dev/null || true)"
          if [ "$SEMVER_UPDATE" = 'release' ]; then
            FROM_TAG="$(git tag --list 'v*' --sort=-v:refname | grep -v -- '-' | head -n 1)"
          fi
          node tools/changelog.ts "$FROM_TAG" "$VERSION" "$SEMVER_UPDATE" \
            > "$RUNNER_TEMP/changelog.txt"
          # Records that this commit was produced by the release workflow rather
          # than typed by hand. GitHub renders it as a co-author.
          printf '\nCo-authored-by: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>\n' \
            >> "$RUNNER_TEMP/changelog.txt"
          git commit --amend -F "$RUNNER_TEMP/changelog.txt"
          git tag -f -m "$VERSION" "v$VERSION"
          git show -s --format=%B

      # Runs on dry runs too, and deliberately before the push: a packaging
      # problem or an already-published version then fails the run while nothing
      # has left the runner, rather than stranding a pushed tag with no package
      # on npm. A dry-run publish still asks the registry about the version.
      - name: Verify publish will work
        run: |
          # Also copied to the run summary, so checking which files went out
          # does not mean opening the log. npm writes all of this to stderr,
          # hence 2>&1; pipefail because the default shell does not fail a step
          # on a failing pipeline, which would quietly turn this gate into a
          # no-op.
          set -o pipefail
          CMD="npm publish --tag $NPM_DIST_TAG --dry-run"
          $CMD 2>&1 | tee "$RUNNER_TEMP/publish.txt"
          {
            echo "### \`$CMD\`"
            echo '```'
            # npm's own lines only; the log keeps everything the publish runs
            # on the way, which is most of it.
            grep '^npm ' "$RUNNER_TEMP/publish.txt" || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # --dry-run still negotiates with the remote, so a tag that already exists
      # upstream is caught here rather than on the real run.
      - name: Push new version
        if: env.SEMVER_UPDATE != 'current'
        env:
          # A branch name reaches the shell as a value rather than as text
          # spliced into the script: git allows `;`, `$` and backticks in a ref
          # name, so an interpolated one is a command waiting to happen.
          BRANCH: ${{ github.ref_name }}
          DRY: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: git push --atomic $DRY origin "$BRANCH" $(git tag --points-at HEAD)

      # No token: npm trusted publishing authenticates this workflow through
      # the OIDC token `id-token: write` grants above.
      - name: Publish to npm
        if: inputs.dry_run == false
        run: npm publish --provenance --tag "$NPM_DIST_TAG"
